<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050713" />
    <meta
      name="description"
      content="COSMOS — an immersive, interactive 3D journey through the solar system and beyond. Explore planets, compare worlds, discover deep-space objects and test your knowledge."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>COSMOS — Explore the Universe</title>
    <style>
      /* Boot screen: shown until the JavaScript bundle mounts. */
      html, body { background: #050713; margin: 0; }
      #boot {
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
        background: radial-gradient(ellipse at 50% 60%, #0b1020 0%, #050713 70%);
        color: #a5aec4; font: 500 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.32em; text-transform: uppercase; transition: opacity 0.5s ease;
      }
      #boot.is-done { opacity: 0; pointer-events: none; }
      #boot .boot-orbit { position: relative; width: 72px; height: 72px; margin: 0 auto 22px; }
      #boot .boot-orbit::before {
        content: ''; position: absolute; inset: 0; border: 1px solid #252d43; border-radius: 50%;
      }
      #boot .boot-orbit::after {
        content: ''; position: absolute; top: -3px; left: 50%; width: 6px; height: 6px; margin-left: -3px;
        border-radius: 50%; background: #72cfff; box-shadow: 0 0 12px #72cfff;
        transform-origin: 3px 39px; animation: boot-spin 1.6s linear infinite;
      }
      #boot .boot-core {
        position: absolute; inset: 26px; border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #f4f6ff, #9a83ff 60%, #252d43);
        opacity: 0.85;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-orbit::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div>
        <div class="boot-orbit" aria-hidden="true"><div class="boot-core"></div></div>
        <div>Cosmos · Initialising</div>
      </div>
    </div>
    <div id="root"></div>
    <noscript>
      <p style="color:#f4f6ff;font-family:sans-serif;padding:24px">
        COSMOS needs JavaScript enabled to render the interactive universe.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
